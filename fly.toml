app = "lithium-sync"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  LITHIUM_DATA_ROOT = "/data"
  MIX_ENV = "prod"
  RELEASE_DISTRIBUTION = "none"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "lithium_data"
  destination = "/data"
